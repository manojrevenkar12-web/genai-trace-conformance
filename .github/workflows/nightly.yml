name: nightly conformance
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  newest-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.13 .venv && uv pip install -r requirements.txt
      - name: Run every scenario on the newest release of every package
        run: .venv/bin/python -m gtc.nightly
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: reports/nightly/
