[project]
name = "genai-trace-conformance"
version = "1.0.0"
description = "Conformance lab for LLM tracing integrations: real SDKs, a local model server, OTLP capture, checks against the truth."
requires-python = ">=3.12"

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PIE", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"scenarios/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["gtc"]

[[tool.mypy.overrides]]
module = ["opentelemetry.proto.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
