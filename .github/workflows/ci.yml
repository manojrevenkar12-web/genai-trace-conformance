name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.13 .venv && uv pip install -r requirements.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q
      - name: Reports are what the code computes from the stored captures; held-out lock holds
        run: .venv/bin/python -m gtc.eval.cli check
      - name: Gates
        run: .venv/bin/python -m gtc.eval.cli gate
      - name: README block is up to date
        run: |
          .venv/bin/python -m gtc.eval.cli readme
          git diff --exit-code README.md reports/REPORT.md

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
